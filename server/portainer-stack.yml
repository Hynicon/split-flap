# Portainer stack (Stacks → Add stack → Web editor) for the image built from
# server/dist/splitflap-server.tar under Images → Build a new image, named splitflap-server:latest.
# Set VIRTUAL_HOST, LETSENCRYPT_HOST and PROXY_NETWORK in the stack's "Environment variables" section.
services:
  splitflap:
    image: splitflap-server:latest
    pull_policy: never  # built on this host, not on a registry
    restart: unless-stopped
    environment:
      # Leave these unset to create the account and the device token on the setup page instead.
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      DEVICE_TOKEN: ${DEVICE_TOKEN:-}
      VIRTUAL_HOST: ${VIRTUAL_HOST:?set VIRTUAL_HOST}
      VIRTUAL_PORT: "8000"
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-}
    volumes:
      - splitflap-data:/data
    networks:
      - proxy

volumes:
  splitflap-data:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy}
