; Split-Flap Social Follower Counter
; Envs: unit (Nano per character), offset_tool (EEPROM calibration), master (ESP32), native (host tests)

[platformio]
src_dir = firmware
data_dir = firmware/master/data
default_envs = unit, master

[env]
build_flags = -I firmware/common

[env:unit]
platform = atmelavr@5.3.0
board = nanoatmega328
; some clones ship the new bootloader: use board = nanoatmega328new
framework = arduino
build_src_filter = -<*> +<unit/src/>
lib_deps =
    arduino-libraries/Stepper@1.1.3
monitor_speed = 115200

[env:offset_tool]
platform = atmelavr@5.3.0
board = nanoatmega328
framework = arduino
build_src_filter = -<*> +<offset_tool/src/>
monitor_speed = 115200

[env:master]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_src_filter = -<*> +<master/src/> +<common/>
build_flags =
    ${env.build_flags}
    -I firmware/master/src
    -D CORE_DEBUG_LEVEL=1
lib_deps =
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3
    tzapu/WiFiManager@2.0.17
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:native]
platform = native
test_build_src = yes
; only the pure (Arduino-free) logic is built for host tests
build_src_filter = -<*> +<common/> +<master/src/display/layout.cpp> +<master/src/logic/>
build_flags =
    ${env.build_flags}
    -I firmware/master/src
    -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson@7.4.3
